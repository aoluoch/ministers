[build]
  command = "npm run build"
  publish = "dist"

# How URLs resolve in production:
#  1. Real files win first — sitemap.xml, robots.txt, /assets/*, and the
#     prerendered per-route index.html files (/about → dist/about/index.html).
#  2. /programs/* falls back to the SPA shell with HTTP 200, so an event that is
#     published in Contentful after the last build still renders (React Router +
#     the Contentful loader fetch it live).
#  3. Anything else is genuinely missing, so Netlify serves dist/404.html with a
#     real HTTP 404 instead of a soft 404.
[[redirects]]
  from = "/programs/*"
  to = "/index.html"
  status = 200

# Genuinely missing URLs get a real HTTP 404 (not a soft 404). Rules without
# `force` only apply when no file matches, so real files and the prerendered
# route HTML are unaffected.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
